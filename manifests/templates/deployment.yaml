apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-app
  namespace: {{NAMESPACE}}
  labels:
    app: preview-app
    pr: "{{PR_NUMBER}}"
    branch: "{{BRANCH}}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-app
  template:
    metadata:
      labels:
        app: preview-app
        pr: "{{PR_NUMBER}}"
    spec:
      containers:
        - name: app
          image: {{IMAGE}}
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: preview-app
  namespace: {{NAMESPACE}}
spec:
  selector:
    app: preview-app
  ports:
    - port: 80
      targetPort: 8080
