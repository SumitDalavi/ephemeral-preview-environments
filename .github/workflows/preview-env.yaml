name: Deploy Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      uses: docker/build-push-action@v3
      with:
        context: ./app
        push: false
        tags: preview-api:pr-${{ github.event.pull_request.number }}
        outputs: type=docker,dest=/tmp/preview-api.tar

    - name: Create k8s Kind Cluster
      uses: helm/kind-action@v1.4.0

    - name: Load image into Kind
      run: |
        kind load image-archive /tmp/preview-api.tar

    - name: Deploy with Kustomize
      run: |
        kubectl create namespace pr-${{ github.event.pull_request.number }} --dry-run=client -o yaml | kubectl apply -f -
        cd kustomize/overlays/preview
        kustomize edit set image preview-api=preview-api:pr-${{ github.event.pull_request.number }}
        kustomize build . | kubectl apply -n pr-${{ github.event.pull_request.number }} -f -
